name: Release

# Builds every binary on one macOS arm64 runner (codesign is there for the darwin outputs), publishes the npm
# packages with trusted publishing, then attaches the binaries to a GitHub release. docs/distribution.md,
# "Releasing", has the one-time npm bootstrap.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish --dry-run and skip the GitHub release
        type: boolean
        default: true

permissions:
  contents: write
  # npm trusted publishing exchanges the GitHub OIDC token for a publish credential.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm 11.5.1 or newer (trusted publishing)
        run: |
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install --global npm@latest
          fi
          npm --version

      - name: Tag matches apps/helper/package.json
        id: version
        run: |
          version=$(node -p 'require("./apps/helper/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" = "v$version" ]; then
            exit 0
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run of $version from $GITHUB_REF"
            exit 0
          fi
          echo "::error::Publishing needs the tag v$version (apps/helper/package.json), got $GITHUB_REF"
          exit 1

      - run: bun install --frozen-lockfile

      # Also regenerates openapi.json and the plugin client, which the plugin build needs.
      - run: bun run typecheck

      - run: bun test

      - run: bun run --cwd apps/plugin build

      - name: Build every target without a Google client
        run: bun run --cwd apps/helper build
        env:
          FONT_SYNC_PUBLIC_BUILD: "1"

      - name: Darwin signatures are valid
        run: |
          for binary in apps/helper/dist/figma-font-sync-darwin-arm64 apps/helper/dist/figma-font-sync-darwin-x64; do
            codesign --verify --strict --verbose=2 "$binary"
          done

      - name: darwin-arm64 binary runs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printed=$(apps/helper/dist/figma-font-sync-darwin-arm64 --version)
          echo "$printed"
          case "$printed" in
            *"$VERSION"*) ;;
            *) echo "::error::expected $VERSION"; exit 1 ;;
          esac

      - run: bun apps/helper/scripts/pack-npm.ts

      # Platform packages first: the main package pins them, so it must not go out unless every one is there.
      - name: Publish platform packages
        working-directory: apps/helper/dist/npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # The first release only: npm adds trusted publishers to existing packages, so it goes out with a
          # short-lived token. npm tries trusted publishing first and falls back to this; unset afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          failed=0
          for name in $(node -p 'Object.keys(require("./figma-font-sync/package.json").optionalDependencies).join(" ")'); do
            dir=${name#@figma-font-sync/}
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
              continue
            fi
            if [ "$DRY_RUN" = true ]; then
              (cd "$dir" && npm publish --access public --dry-run) || failed=1
            else
              (cd "$dir" && npm publish --access public) || failed=1
            fi
          done
          if [ "$failed" != 0 ]; then
            echo "::error::A platform package failed to publish; figma-font-sync was not published."
            exit 1
          fi

      - name: Publish figma-font-sync
        working-directory: apps/helper/dist/npm/figma-font-sync
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # The first release only: npm adds trusted publishers to existing packages, so it goes out with a
          # short-lived token. npm tries trusted publishing first and falls back to this; unset afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "figma-font-sync@$VERSION" version >/dev/null 2>&1; then
            echo "figma-font-sync@$VERSION is already published"
          elif [ "$DRY_RUN" = true ]; then
            npm publish --dry-run
          else
            npm publish
          fi

      - name: GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          binaries=(apps/helper/dist/figma-font-sync-darwin-arm64 apps/helper/dist/figma-font-sync-darwin-x64
            apps/helper/dist/figma-font-sync-windows-x64.exe apps/helper/dist/figma-font-sync-windows-x64-background.exe
            apps/helper/dist/figma-font-sync-linux-x64)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${binaries[@]}" --clobber
          else
            gh release create "v$VERSION" "${binaries[@]}" --title "v$VERSION" --generate-notes --verify-tag
          fi
